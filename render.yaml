services:
  - type: web
    name: fraud-ml-platform
    runtime: python
    plan: free
    pythonVersion: "3.11.9"
    buildCommand: pip install --no-cache-dir numpy==1.26.4 scikit-learn==1.5.2 && pip install --no-cache-dir -r requirements.txt && PYTHONPATH=. python data/ingest.py && PYTHONPATH=. python training/train_render.py
    startCommand: PYTHONPATH=. uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        value: sqlite:///./data/fraud.db
      - key: MLFLOW_TRACKING_URI
        value: sqlite:///./mlruns/mlflow.db
    healthCheckPath: /health
