version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data           # SQLite database
      - ./mlruns:/app/mlruns       # MLflow tracking
      - ./models:/app/models       # Model artifacts
    environment:
      - DATABASE_URL=sqlite:////app/data/fraud.db
      - MLFLOW_TRACKING_URI=sqlite:////app/mlruns/mlflow.db
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mlflow:
    image: python:3.12-slim
    working_dir: /mlflow
    command: >
      sh -c "pip install mlflow -q &&
             mlflow server
               --backend-store-uri sqlite:////mlflow/mlflow.db
               --default-artifact-root /mlflow/artifacts
               --host 0.0.0.0
               --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    restart: unless-stopped

  # Optional: Prometheus + Grafana for production monitoring
  # prometheus:
  #   image: prom/prometheus:latest
